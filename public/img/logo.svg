<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="hexFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1726" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>
  <!-- Hexagonal frame -->
  <polygon points="60,10 105,35 105,85 60,110 15,85 15,35" fill="url(#hexFill)" stroke="url(#glowGrad)" stroke-width="5" stroke-linejoin="round"/>
  <!-- Infinity loop / DevOps symbol -->
  <path d="M42,50 C32,38 24,46 24,60 C24,74 32,82 42,70 L78,50 C88,38 96,46 96,60 C96,74 88,82 78,70 Z" 
        stroke="url(#glowGrad)" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Core node -->
  <circle cx="60" cy="60" r="6" fill="#00F0FF" />
</svg>
