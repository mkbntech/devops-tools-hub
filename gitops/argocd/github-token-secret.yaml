apiVersion: v1
kind: Secret
metadata:
  name: github-pr-token
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
type: Opaque
stringData:
  # Replace with your GitHub Personal Access Token (PAT) with `repo` scope
  # or create a GitHub App with Pull Request read permissions.
  token: "ghp_YOUR_GITHUB_PERSONAL_ACCESS_TOKEN_HERE"
