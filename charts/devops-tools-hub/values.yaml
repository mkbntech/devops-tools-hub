# Default values for devops-tools-hub.
# This configuration is designed for both production and dynamic Ephemeral PR Preview Environments.

# PR Preview Environment Settings
previewEnvironment:
  enabled: false
  prNumber: "0"
  branchName: "main"
  commitSha: ""
  ttlHours: "48"

# Number of pod replicas (kept at 1 for preview environments to optimize costs)
replicaCount: 1

image:
  repository: devopstools1.azurecr.io/devops-tools-hub
  pullPolicy: IfNotPresent
  # Overridden dynamically by Argo CD ApplicationSet: e.g. "pr-12" or "sha-a1b2c3d"
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: "/metrics"
  prometheus.io/port: "4000"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 4000
  targetPort: 4000

ingress:
  enabled: true
  className: "nginx" # Use "nginx" for ingress-nginx, or "webapprouting.kubernetes.azure.com" for AKS Web App Routing
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: "devops-tools.57.166.243.138.nip.io"
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Lightweight resource footprint for ephemeral environments
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 400m
    memory: 384Mi

# Probes
livenessProbe:
  httpGet:
    path: /health
    port: 4000
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 4000
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 2

# Ephemeral storage for preview environments (uses emptyDir for zero-disk cost and fast startup)
persistence:
  enabled: false
  storageClass: "managed-csi"
  accessMode: ReadWriteOnce
  size: 1Gi

# Environment variables injected into the container
env:
  NODE_ENV: "production"
  PORT: "4000"
  SITE_TITLE: "DevOps & Cloud Native Tools Hub"
  PREVIEW_ENV: "false"

# Guardrail: LimitRange enforces default min/max per pod in the preview namespace
limitRange:
  enabled: true
  default:
    cpu: 300m
    memory: 256Mi
  defaultRequest:
    cpu: 50m
    memory: 64Mi
  max:
    cpu: 800m
    memory: 512Mi

# Guardrail: ResourceQuota caps the entire preview namespace so runaway pods cannot consume cluster resources
resourceQuota:
  enabled: true
  hard:
    requests.cpu: "500m"
    requests.memory: "512Mi"
    limits.cpu: "1000m"
    limits.memory: "1Gi"
    pods: "5"
    services: "3"
    secrets: "10"
    configmaps: "10"

# Guardrail: NetworkPolicy ensures preview namespaces cannot probe or talk to production databases or internal microservices
networkPolicy:
  enabled: true
  allowIngressFromCluster: true
  allowDnsEgress: true
